[project]
name = "personaparlour"
version = "0.3.0"
description = "A private, local-first character roleplay and storytelling workspace with voice, vision, and image generation"
authors = [
    {name = "Ravi PURUSHOTTAM", email = "ravi.purushottamrajpurohit@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["ai", "roleplay", "characters", "storytelling", "tts", "stt", "llm", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Web Framework
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "websockets",

    # HTTP Client
    "httpx",

    # Audio Processing
    "numpy",

    # Speech Recognition (STT)
    "faster-whisper",

    # LLM Client
    "ollama",

    # Text-to-Speech (TTS)
    # NeuTTS, default TTS engine: voice cloning plus emotional delivery.
    # The plain torch backbone is roughly 12x slower than real time on CPU; for a
    # CPU-only machine also install llama-cpp-python and point NEUTTS_BACKBONE at
    # a "*-gguf" repo, which is the backend NeuTTS streams from.
    "neutts",
    # Piper TTS, lightweight fallback engine
    "piper-tts",
    "onnxruntime",
    # Chatterbox TTS (Optional - install with: pip install chatterbox-tts)
    # or build from git and pip install
    # This will throw error, please build and install from source by
    # changing the maximum numpy version to 2, and also change the pytorch version
    # "chatterbox-tts",
    # Soprano TTS (Optional - ultra-fast TTS with 80M params)
    "soprano-tts",

    # PyTorch and related libraries
    # NOTE: Install with CUDA 12.8 support using:
    # pip install torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cu128
    # For CPU-only or different CUDA versions, see: https://pytorch.org/get-started/locally/
    # Uncomment for CPU only version, otherwise install with CUDA support as per your system after pip installing this
    # "torch",
    # "torchaudio",
    # "torchvision",

    "torchcodec",

    # Image Generation/Explainers
    "diffusers",
    "transformers",  # Also required for Image Explainer (Qwen3VL)
    "accelerate",
    "Pillow",

    # Logging
    "rich",

    # Other
    "python-multipart",
    "nvidia-ml-py",  # pynvml for GPU monitoring (like nvtop)
    "psutil",  # System resource monitoring

    # reupgrade, once installattion is complete
    # "peft", # lmdeploy requires less than 0.11.1 but we need higher version for qwen3vl-7b
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Required by the asyncio_mode = "auto" setting below; without it every
    # async test silently fails on a coroutine that was never awaited.
    "pytest-asyncio",
    "black",
    "ruff",
    "hatch",
]
# GGUF backbones for NeuTTS — the practical way to run it on a CPU-only box.
gguf = [
    "llama-cpp-python",
]

[project.urls]
Homepage = "https://github.com/ravipurohit1991/PersonaParlour"
Repository = "https://github.com/ravipurohit1991/PersonaParlour"
Issues = "https://github.com/ravipurohit1991/PersonaParlour/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/personaparlour/__init__.py"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel]
include = ["src/*"]
exclude = ["src/*.py", ".env"]
force-include = { dist = "personaparlour/frontend" }

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/frontend",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
